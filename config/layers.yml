# 공간 레이어 레지스트리. 여기 등록된 레이어만 분석에 쓴다.
# expected_count는 검증 기준값. 데이터를 재수집(새 export)하면 사용자 확인 후 갱신한다.
# security: internal(좌표 포함 산출물은 out/internal만) / public(집계 공개 가능)
# 경로는 DATA_ROOT(기본 D:\z03.SmartGrid) 기준 상대경로.

datasets:
  - id: kor_infra
    kind: gpkg
    path: powergrid_spatial_data/36pJ2bwdQr/KOR.gpkg
    source: OpenInfraMap export 2026-09-01 (© OpenStreetMap contributors)
    license: ODbL
    security: internal
    crs_epsg: 4326
    verified: 2026-09-21   # sqlite 직접 집계. docs/06_gpkg_inventory.md(2026-09-14)와 일치
